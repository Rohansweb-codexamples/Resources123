<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Resources Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7ed;color:#20352a;font:16px/1.5 system-ui,sans-serif}.top{background:linear-gradient(110deg,#123c2b,#2d7047);padding:23px;color:white}.topin,main{max-width:950px;margin:auto}.topin{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:white}main{padding:25px 18px}.panel{background:white;border:1px solid #e0e8da;border-radius:18px;padding:24px;margin:15px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.wide{grid-column:1/-1}label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cedbcb;border-radius:10px;font:inherit}textarea{min-height:80px}button{border:0;background:#174c35;color:white;border-radius:10px;padding:12px 18px;font-weight:750;cursor:pointer}.danger{background:#a43c32}.msg{color:#a33a2b}.muted{color:#6b7b6e;font-size:14px}.item{border-top:1px solid #e0e8da;padding:15px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}.item small{display:block;color:#68786a}@media(max-width:580px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.topin{align-items:flex-start;flex-direction:column}.panel{padding:18px}}
</style></head><body><header class="top"><div class="topin"><div><strong>Rohans Web · Resources Admin</strong><div class="muted" style="color:#e0eee1">Private library management</div></div><a href="/">View public page ↗</a></div></header><main><section class="panel" id="authPanel"><h2 id="authTitle">Checking access…</h2><p class="muted" id="authInfo">Password protection is handled by the server.</p><form id="authForm"><div class="fields"><div class="wide"><label for="password">Administrator password</label><input id="password" type="password" required minlength="12" autocomplete="current-password"></div><div class="wide" id="confirmWrap" hidden><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="12" autocomplete="new-password"></div></div><p class="msg" id="authMsg"></p><button id="authButton">Continue</button></form></section><div id="dashboard" hidden><section class="panel"><h2>Upload a resource</h2><p class="muted">Resources are published to the public page after upload. Maximum file size: 25 MB.</p><form id="uploadForm"><div class="fields"><div><label for="title">Title *</label><input id="title" name="title" maxlength="120" required placeholder="Space display pack"></div><div><label for="category">Category</label><select name="category" id="category"><option>Worksheets</option><option>Display</option><option>Activities</option><option>Reading</option><option>Maths</option><option>Science</option><option>Space</option><option>Templates</option><option>General</option></select></div><div class="wide"><label for="description">Description</label><textarea id="description" name="description" maxlength="1000"></textarea></div><div class="wide"><label for="file">Choose file *</label><input id="file" name="file" type="file" required accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.svg,.docx,.pptx,.zip,.txt,.csv,.mp3,.wav,.ogg,.mp4,.webm"></div></div><p class="msg" id="uploadMsg"></p><button id="uploadButton">Upload resource</button></form></section><section class="panel"><h2>Published resources</h2><div id="items">Loading…</div></section><button id="logout">Sign out</button></div></main><script>
const $=s=>document.querySelector(s);let setup=false;async function api(url,opts={}){let r=await fetch(url,opts),d=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){try{let s=await api('/api/auth/status');setup=s.setupRequired;if(s.authenticated)return show();$('#authTitle').textContent=setup?'Create administrator password':'Administrator sign in';$('#authInfo').textContent=setup?'First-time setup: choose at least 12 characters. Only a password hash is saved on the server.':'Enter your administrator password.';$('#confirmWrap').hidden=!setup;$('#password').autocomplete=setup?'new-password':'current-password';$('#authButton').textContent=setup?'Set password':'Sign in'}catch(e){$('#authTitle').textContent='Server unavailable';$('#authInfo').textContent=e.message+' Start the Node server and try again.';$('#authForm').hidden=true}}
$('#authForm').onsubmit=async e=>{e.preventDefault();$('#authMsg').textContent='';let password=$('#password').value;if(setup&&password!==$('#confirm').value){$('#authMsg').textContent='Passwords do not match.';return}try{await api(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});show()}catch(e){$('#authMsg').textContent=e.message}};
function show(){$('#authPanel').hidden=true;$('#dashboard').hidden=false;refresh()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function refresh(){try{let a=await api('/api/admin/resources');$('#items').innerHTML=a.length?a.map(x=>'<div class="item"><div><strong>'+esc(x.title)+'</strong><small>'+esc(x.category)+' · '+esc(x.originalName)+'</small><a href="'+esc(x.fileUrl)+'" target="_blank" rel="noopener">Open file</a></div><button class="danger" data-id="'+esc(x.id)+'">Delete</button></div>').join(''):'<p class="muted">No resources yet. Upload your first one above.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this resource permanently?'))return;try{await api('/api/admin/resources/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});refresh()}catch(e){alert(e.message)}})}catch(e){$('#items').textContent=e.message}}
$('#uploadForm').onsubmit=async e=>{e.preventDefault();$('#uploadMsg').textContent='';$('#uploadButton').disabled=true;$('#uploadButton').textContent='Uploading…';try{await api('/api/admin/resources',{method:'POST',body:new FormData(e.currentTarget)});e.currentTarget.reset();$('#uploadMsg').textContent='Uploaded and published successfully.';$('#uploadMsg').style.color='#24613b';refresh()}catch(e){$('#uploadMsg').textContent=e.message}finally{$('#uploadButton').disabled=false;$('#uploadButton').textContent='Upload resource'}};
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};init();
</script></body></html>
