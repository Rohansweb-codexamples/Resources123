<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174c35"><title>Resource | Rohans Web</title><style>
:root{--forest:#174c35;--cream:#f5f7ed;--ink:#20352a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{padding:20px max(22px,calc((100% - 1000px)/2));background:linear-gradient(125deg,#103a29,#246344);color:white}header a{color:white;text-decoration:none;font-weight:750}main{max-width:1000px;margin:30px auto;padding:0 20px 50px}.panel{background:white;border:1px solid #dfe8d9;border-radius:22px;padding:clamp(18px,4vw,38px)}.cat{color:#4b7b4d;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.preview{width:100%;max-height:72vh;object-fit:contain;background:#f1f4ed;border-radius:14px;margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-block;background:var(--forest);color:white;padding:12px 17px;border-radius:11px;text-decoration:none;font-weight:750}.muted{color:#68786b}.error{padding:25px;text-align:center}@media(max-width:600px){main{margin-top:16px}.panel{padding:18px}}
</style></head><body><header><a href="index.html">← Back to Resource Garden</a></header><main><article class="panel" id="resource"><p class="muted">Loading resource…</p></article></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');const el=document.querySelector('#resource');const isImage=x=>/^image\/(png|jpe?g|gif|webp|svg\+xml)$/i.test(x.mimeType||'')||/\.(png|jpe?g|gif|webp|svg)$/i.test(x.originalName||'');
fetch('/api/resources').then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{const x=items.find(a=>a.id===id);if(!x)throw Error('Resource not found');document.title=x.title+' | Rohans Web Resources';el.innerHTML='<div class="cat">'+esc(x.category||'General')+'</div><h1>'+esc(x.title)+'</h1><p class="muted">'+esc(x.description||'')+'</p>'+(isImage(x)?'<img class="preview" src="'+esc(x.fileUrl)+'" alt="'+esc(x.title)+'">':'<p class="muted">File: '+esc(x.originalName||'Download')+' · '+Math.max(1,Math.round((x.size||0)/1024))+' KB</p>')+'<div class="actions"><a class="btn" href="'+esc(x.fileUrl)+'" target="_blank" rel="noopener">Open file ↗</a><a class="btn" href="'+esc(x.fileUrl)+'" download>Download</a></div>'}).catch(()=>{el.innerHTML='<div class="error"><h1>Resource not found</h1><p class="muted">It may have been removed, or the library is temporarily unavailable.</p><a class="btn" href="index.html">Back to resources</a></div>'});
</script></body></html>
