<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174c35"><title>Resource | Rohans Web</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7ed;color:#20352a;font:16px/1.55 system-ui,Arial,sans-serif}header{background:linear-gradient(125deg,#103a29,#246344);padding:20px max(18px,calc((100% - 960px)/2))}header a{color:white;text-decoration:none;font-weight:750}main{max-width:960px;margin:28px auto;padding:0 18px 50px}.panel{background:white;border:1px solid #dfe8d9;border-radius:20px;padding:clamp(18px,4vw,36px)}.cat{color:#4b7b4d;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.muted{color:#68786b}.preview{display:block;max-width:100%;max-height:72vh;object-fit:contain;margin:20px auto;background:#eff3e9;border-radius:12px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{background:#174c35;color:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:750}.error{text-align:center;padding:30px}@media(max-width:520px){main{margin-top:15px}}</style></head><body><header><a href="/">← Back to Resource Garden</a></header><main><article class="panel" id="resource"><p class="muted">Loading resource…</p></article></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=new URLSearchParams(location.search).get('id');function isImage(x){return /^image\/(png|jpeg|jpg|gif|webp|svg\+xml)$/i.test(x.mimeType||'')||/\.(png|jpe?g|gif|webp|svg)$/i.test(x.originalName||'')}async function load(){try{const r=await fetch('/api/resources',{cache:'no-store'});if(!r.ok)throw Error('Could not connect to the resource library.');const rows=await r.json(),x=rows.find(v=>v.id===id);if(!x)throw Error('This resource could not be found.');document.title=x.title+' | Rohans Web';$('#resource').innerHTML='<div class="cat">'+esc(x.category||'General')+'</div><h1>'+esc(x.title||x.originalName)+'</h1><p class="muted">'+esc(x.description||'')+'</p>'+(isImage(x)?'<img class="preview" src="'+esc(x.fileUrl)+'" alt="'+esc(x.title)+'">':'<p class="muted">File: '+esc(x.originalName||'Resource')+' · '+Math.max(1,Math.round((x.size||0)/1024))+' KB</p>')+'<div class="actions"><a class="btn" href="'+esc(x.fileUrl)+'" target="_blank" rel="noopener">Open file</a><a class="btn" href="'+esc(x.fileUrl)+'" download>Download</a></div>'}catch(e){$('#resource').innerHTML='<div class="error"><h1>Resource unavailable</h1><p class="muted">'+esc(e.message)+'</p><a class="btn" href="/">Back to resources</a></div>'}}load();
</script></body></html>
